- title: Cache-Control in the Wild
  bullets:
    - Hook: coworker sees old page, you see new; headers say max-age/s-maxage/stale-while-revalidate
    - Goal: read Cache-Control and know which cache answered
- title: Two caches
  bullets:
    - Browser cache (per user) vs shared cache/CDN (for everyone)
    - Cache-Control governs reuse windows; it doesn’t push deploys
- title: Plain-language directives
  bullets:
    - max-age = reuse window for any cache (unless overridden)
    - s-maxage = override for shared caches only
    - must-revalidate = after expiry, revalidate before reuse
    - stale-while-revalidate = may serve stale while fetching fresh
- title: How CDN vs browser diverge
  bullets:
    - s-maxage 30s at CDN, max-age 300s in browser: CDN refreshes sooner
    - Browser can keep old version longer even after CDN refreshed
    - Age hints shared cache lifetime; browser age isn’t exposed
- title: Diagram
  bullets:
    - Browser cache -> CDN/edge cache -> Origin
    - Headers flow back with Cache-Control + Age + validators
- title: Demo commands
  code: |
    # Baseline headers
    curl -I https://example.com/page.html
    # Force revalidation path
    curl -I -H 'Cache-Control: no-cache' https://example.com/page.html
    # Rapid repeat to observe stale-while-revalidate
    curl -I https://example.com/page.html; sleep 1; curl -I https://example.com/page.html
- title: Common traps
  bullets:
    - no-cache ≠ no storage; it means revalidate before reuse
    - s-maxage overrides max-age for shared caches; browsers ignore it
    - Age is about the shared cache entry, not your browser cache
    - stale-while-revalidate can serve old content while fetching new
- title: Practical reads
  bullets:
    - Look at Cache-Control + Age + ETag/Last-Modified together
    - Use Cache-Control: no-cache probe to force revalidation
    - Treat CDN headers (Via/CF-Cache-Status) as hints, not guarantees
- title: Recap checklist
  bullets:
    - Identify which cache answered
    - Note max-age/s-maxage/must-revalidate/stale-while-revalidate
    - Log URL, time, status, Cache-Control, Age, validators, CDN hints
